[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @boggle/dictionary build && pnpm --filter @boggle/web build"
  publish = "apps/web/dist"

# Il dizionario e' immutabile: cache aggressiva + Brotli servito direttamente da Netlify.
[[headers]]
  for = "/dictionary/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Asset con hash: cache lunga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA: tutte le rotte vanno a index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# WebSocket e API NON sono su Netlify (server Socket.IO su Railway).
# Il client usa VITE_SERVER_URL per raggiungerlo.
